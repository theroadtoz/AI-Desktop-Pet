<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desktop Pet Chat</title>
  </head>
  <body>
    <main class="chat-shell">
      <nav class="legacy-page-nav" hidden aria-label="兼容导航">
        <button id="chat-tab" class="subpage-tab is-active" type="button">聊天</button>
        <button id="history-tab" class="subpage-tab" type="button">历史</button>
        <button id="memory-tab" class="subpage-tab" type="button">记忆</button>
      </nav>
      <section id="chat-page" class="chat-page">
        <header class="phone-topbar">
          <div class="phone-identity">
            <img class="phone-avatar" src="./assets/figma/avatar.svg" alt="" />
            <div class="phone-identity-copy">
              <strong class="phone-partner-name">西塔</strong>
              <span class="phone-presence">
                <img class="phone-status-light" src="./assets/figma/status-light.svg" alt="" />
                <span id="chat-presence-text">聊天中</span>
              </span>
            </div>
          </div>
          <div class="phone-system-area">
            <div class="phone-system-status" aria-hidden="true">
              <time id="phone-clock">9:30</time>
              <img src="./assets/figma/wifi.svg" alt="" />
              <img src="./assets/figma/signal.svg" alt="" />
              <img class="phone-battery" src="./assets/figma/battery.svg" alt="" />
            </div>
            <button id="settings-button" class="phone-icon-button chat-settings-entry" type="button" aria-label="打开伙伴设置" title="伙伴设置">
              <img src="./assets/figma/settings.svg" alt="" />
            </button>
            <button id="chat-close-button" class="phone-icon-button phone-close-button" type="button" aria-label="关闭聊天窗口" title="关闭">
              <img src="./assets/figma/close.svg" alt="" />
            </button>
          </div>
        </header>
        <section id="messages" class="messages" aria-live="polite"></section>
        <p id="chat-session-note" class="selection-note" data-state="fallback" hidden aria-live="polite">新会话将仅在本地保存；发送时只包含当前消息。</p>
        <form id="chat-form" class="composer">
          <textarea id="chat-input" rows="1" autocomplete="off" placeholder="和她说点什么..." aria-label="聊天输入"></textarea>
          <button id="send-button" class="button phone-send-button" type="submit" aria-label="发送">
            <img src="./assets/figma/send-arrow.svg" alt="" />
            <span class="visually-hidden">发送</span>
          </button>
          <button id="abort-button" class="button-light" type="button" hidden disabled>中断</button>
        </form>
      </section>
      <section id="settings-panel" class="settings-panel" hidden aria-label="伙伴设置">
        <div class="settings-header">
          <h2>伙伴设置</h2>
          <button id="settings-close-button" class="button-light" type="button">关闭</button>
        </div>
        <nav class="subpage-nav settings-nav" aria-label="设置分类">
          <button id="settings-basic-tab" class="subpage-tab is-active" type="button" data-settings-page="basic">基础设置</button>
          <button id="settings-data-tab" class="subpage-tab" type="button" data-settings-page="data">记忆和历史</button>
        </nav>
        <form id="settings-form" class="content-stack">
          <section id="settings-basic-page" class="settings-page content-stack" aria-labelledby="basic-settings-title">
            <h3 id="basic-settings-title" class="settings-page-title">基础设置</h3>
            <details id="general-settings-group" class="settings-expander" open>
              <summary>
                <span class="settings-expander-copy">
                  <strong>日常使用</strong>
                  <small>主动气泡与新建对话</small>
                </span>
              </summary>
              <div class="fold-body">
                <label class="settings-row">
                  <span class="settings-row-copy">
                    <strong>主动气泡</strong>
                    <small>允许伙伴在合适时机主动说一句</small>
                  </span>
                  <input id="proactive-companion-enabled" class="figma-switch" type="checkbox" role="switch" />
                </label>
                <div class="settings-actions">
                  <button id="new-conversation-button" class="button" type="button">新建对话</button>
                </div>
              </div>
            </details>
            <details id="appearance-settings-group" class="settings-expander">
              <summary>
                <span class="settings-expander-copy">
                  <strong>伙伴外观</strong>
                  <small>大小与桌面锁定</small>
                </span>
              </summary>
              <section id="settings-appearance-page" class="fold-body figma-settings-group" aria-labelledby="pet-scale-title">
                <h3 id="pet-scale-title" class="settings-section-title">桌宠显示</h3>
                <div id="figma-pet-lock-slot" class="figma-control-slot">
                  <button id="toggle-pet-lock-button" class="figma-switch-row" type="button" role="switch" aria-checked="false" aria-label="锁定桌宠">
                    <span class="pet-lock-toggle-label" aria-hidden="true">
                      <span data-lock-label="unlocked">锁定桌宠</span>
                      <span data-lock-label="locked">解除锁定</span>
                    </span>
                    <span class="figma-switch figma-switch-display" aria-hidden="true"></span>
                  </button>
                </div>
                <div id="figma-pet-scale-slot" class="figma-control-slot">
                  <label class="field-label">
                    <span>桌宠大小：<output id="pet-scale-value" aria-live="polite">100%</output></span>
                    <span class="figma-scale-control">
                      <span class="figma-scale-visual" aria-hidden="true">
                        <span class="figma-scale-fill"></span>
                        <span class="figma-scale-handle"></span>
                      </span>
                      <input id="pet-scale" name="petScale" type="range" min="0.50" max="2.00" step="0.25" value="1.00" list="pet-scale-stops" />
                    </span>
                    <datalist id="pet-scale-stops">
                      <option value="0.50"></option>
                      <option value="0.75"></option>
                      <option value="1.00"></option>
                      <option value="1.25"></option>
                      <option value="1.50"></option>
                      <option value="1.75"></option>
                      <option value="2.00"></option>
                    </datalist>
                  </label>
                </div>
              </section>
            </details>
            <details id="model-settings-group" class="settings-expander">
              <summary>
                <span class="settings-expander-copy">
                  <strong>模型与联网</strong>
                  <small>对话模型和搜索连接</small>
                </span>
              </summary>
              <section id="settings-model-page" class="fold-body" aria-labelledby="provider-settings-title">
                <section class="content-stack" aria-labelledby="provider-settings-title">
                  <h3 id="provider-settings-title" class="settings-section-title">对话模型</h3>
                  <section class="partner-status-band" aria-label="魔女状态缎带">
                    <p id="partner-status" class="status-box ribbon-primary" aria-live="polite">桌面伙伴 · 默认陪伴</p>
                    <p id="provider-status" class="status-box ribbon-provider" aria-live="polite">正在读取模型状态...</p>
                  </section>
                  <div id="openai-fields" class="content-stack" hidden>
                    <label id="local-provider-preset-field" class="field-label">
                      连接方式
                      <select id="local-provider-preset" name="localPresetId">
                        <option value="embedded-llama-cpp">内置本地模型</option>
                        <option value="custom-local">外部 OpenAI-compatible 模型</option>
                      </select>
                    </label>
                    <section id="external-provider-settings" class="content-stack" hidden>
                      <label class="field-label">
                        Base URL
                        <input id="provider-base-url" name="baseURL" type="url" inputmode="url" />
                      </label>
                      <label class="field-label">
                        模型
                        <input id="provider-model" name="model" type="text" />
                      </label>
                      <section id="connection-safe-section" class="content-stack" aria-labelledby="connection-safe-title">
                        <h3 id="connection-safe-title" class="settings-section-title">API Key</h3>
                        <div class="api-key-section">
                          <span id="api-key-status" class="status-box" aria-live="polite">API Key：未配置</span>
                          <label class="field-label">
                            更新 API Key
                            <input id="provider-api-key" name="apiKey" type="password" autocomplete="new-password" placeholder="留空则不更新" />
                          </label>
                          <button id="delete-api-key-button" class="button-danger" type="button">删除 API Key</button>
                          <div id="delete-key-confirmation" class="status-box delete-confirmation" hidden>
                            <span>删除后无法恢复，是否继续？</span>
                            <span class="inline-actions">
                              <button id="cancel-delete-api-key-button" class="button-light" type="button">取消</button>
                              <button id="confirm-delete-api-key-button" class="button-danger" type="button">确认删除</button>
                            </span>
                          </div>
                        </div>
                      </section>
                      <button id="provider-health-check-button" class="button-light" type="button">检查连接</button>
                      <p id="provider-health-status" class="status-box" aria-live="polite">连接检查尚未运行。</p>
                    </section>
                  </div>
                  <div class="settings-actions">
                    <button class="button" type="submit">保存模型设置</button>
                  </div>
                </section>
                <section class="content-stack" aria-labelledby="web-search-title">
                  <h3 id="web-search-title" class="settings-section-title">联网搜索 MCP</h3>
                  <span id="figma-mcp-light" class="figma-mcp-light" data-connection="disabled" aria-hidden="true"></span>
                  <p class="selection-note">内置 MCP 搜索默认开启，使用百度网页兼容适配器。</p>
                  <p id="web-search-status" class="status-box" data-state="fallback" aria-live="polite">正在读取联网搜索状态...</p>
                  <div class="field-grid field-grid-compact">
                    <label class="field-label">
                      超时（毫秒）
                      <input id="web-search-timeout" type="number" min="1000" max="60000" step="1000" />
                    </label>
                    <label class="field-label">
                      结果数
                      <input id="web-search-max-results" type="number" min="1" max="5" step="1" />
                    </label>
                  </div>
                  <div class="settings-actions">
                    <button id="web-search-save-button" class="button-light" type="button">保存搜索设置</button>
                    <button id="web-search-test-button" class="button-light" type="button">测试连接</button>
                  </div>
                </section>
              </section>
            </details>
          </section>
          <section id="settings-data-page" class="settings-page content-stack" hidden aria-labelledby="data-settings-title">
            <h3 id="data-settings-title" class="settings-page-title">记忆和历史</h3>
            <details id="memory-settings-group" class="settings-expander" open>
              <summary>
                <span class="settings-expander-copy">
                  <strong>记忆</strong>
                  <small>已保存的长期偏好与称呼</small>
                </span>
              </summary>
              <section id="memory-page" class="memory-page fold-body" aria-label="本地记忆">
                <div class="memory-actions">
                  <label class="settings-row">
                    <span class="settings-row-copy">
                      <strong>使用记忆</strong>
                      <small>关闭后停止采集和使用，已有内容仍保留</small>
                    </span>
                    <input id="memory-enabled" class="figma-switch" type="checkbox" role="switch" />
                  </label>
                  <button id="new-memory-button" class="button-light" type="button">新建记忆</button>
                  <button id="memory-manage-button" class="button-light" type="button">选择管理</button>
                </div>
                <div id="memory-management-actions" class="settings-actions management-toolbar" hidden>
                  <span id="memory-selection-count" class="selection-note">未选择记忆</span>
                  <button id="memory-delete-selected-button" class="button-danger" type="button">删除所选</button>
                  <button id="memory-forget-selected-button" class="button-danger" type="button">忘记所选类型</button>
                  <button id="memory-cancel-manage-button" class="button-light" type="button">取消</button>
                </div>
                <section id="memory-draft-panel" class="memory-draft-panel content-stack" hidden aria-label="新建事实卡">
                  <label class="field-label">
                    记忆内容
                    <textarea id="memory-draft-content" maxlength="800"></textarea>
                  </label>
                  <div class="settings-actions">
                    <button id="cancel-memory-draft-button" class="button-light" type="button">取消</button>
                    <button id="save-memory-draft-button" class="button" type="button">保存记忆</button>
                  </div>
                </section>
                <label class="field-label">
                  搜索记忆
                  <input id="memory-search" type="search" placeholder="搜索已保存的记忆" />
                </label>
                <div class="settings-list-heading">
                  <strong>已保存的记忆</strong>
                </div>
                <div id="memory-list" class="memory-list fold-body"></div>
              </section>
            </details>
            <details id="history-settings-group" class="settings-expander">
              <summary>
                <span class="settings-expander-copy">
                  <strong>历史对话</strong>
                  <small>查看或删除本地会话记录</small>
                </span>
              </summary>
              <section id="history-page" class="history-page fold-body" aria-label="本地聊天历史">
                <ol id="conversation-list" class="conversation-list" aria-label="会话列表"></ol>
                <section id="history-detail" class="history-detail content-stack" aria-live="polite"></section>
              </section>
            </details>
          </section>
          <p id="settings-feedback" class="status-box" hidden aria-live="polite"></p>
          <div hidden aria-hidden="true">
            <button id="enable-memory-button" type="button">切换记忆</button>
            <button id="clear-memory-button" type="button">清空记忆</button>
            <div id="clear-memory-confirmation">
              <button id="cancel-clear-memory-button" type="button">取消</button>
              <button id="confirm-clear-memory-button" type="button">确认</button>
            </div>
            <p id="memory-feedback"></p>
            <p id="memory-create-note"></p>
            <p id="memory-overview-status"></p>
            <p id="memory-next-injection-status"></p>
            <div id="memory-safe-stats"></div>
            <div id="memory-reviews"></div>
            <p id="memory-session-status"></p>
            <div id="memory-suppressions"></div>
            <button id="clear-memory-suppressions-button" type="button">清空已忘记类型</button>
            <div id="clear-memory-suppressions-confirmation">
              <button id="cancel-clear-memory-suppressions-button" type="button">取消</button>
              <button id="confirm-clear-memory-suppressions-button" type="button">确认</button>
            </div>
            <input id="memory-draft-title" type="text" />
            <input id="memory-draft-tags" type="text" />
            <section id="memory-detail"></section>
            <select id="provider-id" name="providerId">
              <option value="local-openai-compatible">内置本地模型</option>
            </select>
            <input id="provider-display-name" name="displayName" type="text" />
            <input id="provider-temperature" name="temperature" type="number" />
            <input id="provider-max-tokens" name="maxTokens" type="number" />
            <input id="provider-timeout" name="timeoutMs" type="number" />
            <p id="local-provider-note"></p>
            <button id="provider-reset-local-button" type="button">恢复内置模型</button>
            <p id="proactive-companion-status"></p>
            <div id="proactive-cadence-controls"></div>
            <input id="proactive-memory-source-bubbles" type="checkbox" checked />
            <input id="proactive-search-source-bubbles" type="checkbox" checked />
            <button id="save-proactive-companion-settings-button" type="button">保存气泡</button>
            <p id="environment-action-status"></p>
            <input id="environment-basic-enabled" type="checkbox" checked />
            <input id="environment-music-enabled" type="checkbox" checked />
            <input id="environment-explicit-game-context-enabled" type="checkbox" checked />
            <button id="save-environment-action-settings-button" type="button">保存环境感知</button>
            <p id="dialogue-affect-status"></p>
            <input id="dialogue-affect-enabled" type="checkbox" checked />
            <button id="save-dialogue-affect-settings-button" type="button">保存情感适配</button>
            <div id="pet-accessory-groups"></div>
            <p id="pet-accessory-status"></p>
            <button id="save-pet-scale-button" type="button">保存大小</button>
            <button id="save-pet-accessory-button" type="button">保存配件</button>
            <p id="pet-lock-status"></p>
            <section id="companion-control-shelf">
              <button id="shelf-accessory-button" type="button">配件</button>
              <button id="shelf-scale-button" type="button">大小</button>
              <button id="shelf-lock-button" type="button">锁定</button>
              <p id="shelf-action-echo"></p>
            </section>
            <div id="shortcut-list"></div>
            <p id="shortcut-status"></p>
          </div>
        </form>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
